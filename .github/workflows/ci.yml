name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Dependency audit
        working-directory: backend
        run: npm audit --omit=dev --audit-level=moderate

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Dependency audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

  secrets:
    name: No default secrets committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards the regression that mattered most: a secret with a value baked
      # into the repository is identical on every installation.
      - name: Reject hardcoded secret defaults
        run: |
          if grep -rnE "(JWT_SECRET|ENCRYPTION_KEY)\s*[:=]\s*['\"][^'\"$]{8,}" \
              --include='*.ts' --include='*.yml' --include='*.yaml' \
              backend/src docker-compose.yml; then
            echo "::error::Segredo com valor padrão embutido no código."
            exit 1
          fi
          echo "OK: nenhum segredo padrão encontrado."

      - name: Ensure .env is not tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env não deve ser versionado."
            exit 1
          fi
          echo "OK: .env não está versionado."
