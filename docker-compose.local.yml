# ==============================================================================
# AegisPanel - stack local isolada
#
#   docker compose -f docker-compose.local.yml up -d --build
#
# Isolada da produção de propósito:
#   - Nome de projeto próprio (aegispanel-local), então rede, volumes e
#     contêineres não colidem com uma instalação de produção na mesma máquina.
#   - Portas altas: 3001 para o painel, 8080/8443 para o proxy. Não disputa a
#     80/443 com nada e não precisa de root para abrir.
#   - AEGIS_LOCAL_MODE=true: certificados TLS internos (nenhuma chamada ao
#     Let's Encrypt), notificações externas bloqueadas e agendador de cron
#     desligado. Ver README.
#   - Dados em ./data-local, separados de ./data.
#
# Painel: http://localhost:3001
# ==============================================================================

name: aegispanel-local

services:
  caddy:
    image: caddy:2-alpine
    container_name: aegis-local-caddy
    restart: unless-stopped
    ports:
      # Só no loopback: nada desta stack fica exposto na rede.
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile.local:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - aegis-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-local-backend
    restart: unless-stopped
    expose:
      - "4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - AEGIS_LOCAL_MODE=true
      # This stack names its containers differently from production, so the
      # panel's own upstream has to be named explicitly.
      - AEGIS_PANEL_UPSTREAM=aegis-local-frontend:80
      - AEGIS_CADDY_CONTAINER=aegis-local-caddy
      - AEGIS_DOCKER_NETWORK=aegis-local-net
      - PORT=4000
      - DATA_DIR=/app/data
      - CADDY_CONFIG_PATH=/app/caddy/Caddyfile.local
      - ACCESS_LOG_PATH=/var/log/caddy/access.log
      # Resolves visitor addresses to a city for the analytics map. Off by
      # default because it sends those addresses to ip-api.com; set
      # GEOIP_ENABLED=true in .env to turn it on.
      - GEOIP_ENABLED=${GEOIP_ENABLED:-false}
      # Comma-separated CIDRs of a CDN or proxy in front of Caddy. Without it,
      # every visit behind a CDN is attributed to the CDN's own address.
      - AEGIS_TRUSTED_PROXIES=${AEGIS_TRUSTED_PROXIES:-}
      - AEGIS_PUBLIC_BASE_URL=${AEGIS_PUBLIC_BASE_URL:-}
      - AEGIS_SUPABASE_PUBLIC_HOST=${AEGIS_SUPABASE_PUBLIC_HOST:-}
      - DOCKER_SOCKET=/var/run/docker.sock
      - TZ=${TZ:-America/Sao_Paulo}
      # Segredos fixos e sem valor: são só de desenvolvimento e nunca protegem
      # nada real. Não reaproveite em produção.
      - JWT_SECRET=local-dev-only-jwt-secret-0000000000000000
      - ENCRYPTION_KEY=local-dev-only-encryption-key-000000000000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data-local:/app/data
      - ./caddy:/app/caddy
      - caddy_logs:/var/log/caddy:ro
    networks:
      - aegis-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-local-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    depends_on:
      - backend
    networks:
      - aegis-net

networks:
  aegis-net:
    name: aegis-local-net
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
