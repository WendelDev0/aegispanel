server {
    listen 80;
    server_name _;
    server_tokens off;

    # Docker's embedded DNS. Needed because of how nginx resolves upstreams:
    # a literal name in proxy_pass is resolved once, at startup, and the address
    # is cached for the life of the worker. Recreating the backend gives it a new
    # container IP, and nginx keeps dialling the old one — every API call answers
    # 502 until someone restarts this container.
    #
    # That is not a rare edge: `docker compose up -d --build` recreates the
    # backend whenever its image changes, which is every panel update. It locked
    # the operator out of the panel with "Erro na autenticação" on the login
    # screen, because the browser got an HTML 502 where it expected JSON.
    #
    # Putting the upstream in a variable forces nginx to resolve it per request,
    # through this resolver, honouring the record's TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:;" always;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location /api/ {
        # Variable on purpose — see the resolver comment above. With a literal
        # here, nginx caches the backend's address forever.
        #
        # $request_uri, not a literal path: once proxy_pass contains a variable,
        # nginx stops substituting the matched location prefix and sends exactly
        # the URI written here. `http://$var/api/` therefore delivered `/api/`
        # for every request, and the backend answered 404 to the whole panel.
        # $request_uri is the original URI with its query string, which is what
        # the backend expects.
        set $aegis_backend "backend:4000";
        proxy_pass http://$aegis_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        # Same rule as /api/ above. Socket.IO carries its session in the query
        # string (EIO, transport, sid), so dropping it answered 400 on every
        # handshake.
        set $aegis_backend_ws "backend:4000";
        proxy_pass http://$aegis_backend_ws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
