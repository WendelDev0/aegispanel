services:
  # Caddy Reverse Proxy with Automatic SSL (HTTPS Let's Encrypt)
  caddy:
    image: caddy:2-alpine
    container_name: aegis-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      # Access logs, read by the backend to build per-application analytics.
      - caddy_logs:/var/log/caddy
    networks:
      - aegis-net

  # Backend & Server Daemon
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aegis-backend
    restart: unless-stopped
    # No published ports on purpose. The API is reached through the frontend's
    # nginx proxy on the internal network; publishing 4000 exposed the API and
    # the terminal WebSocket directly to the internet.
    expose:
      - "4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATA_DIR=/app/data
      - CADDY_CONFIG_PATH=/app/caddy/Caddyfile
      - ACCESS_LOG_PATH=/var/log/caddy/access.log
      - AEGIS_CADDY_CONTAINER=aegis-caddy
      # Resolves visitor addresses to a city for the analytics map. Off by
      # default because it sends those addresses to ip-api.com; set
      # GEOIP_ENABLED=true in .env to turn it on.
      - GEOIP_ENABLED=${GEOIP_ENABLED:-false}
      # Comma-separated CIDRs of a CDN or proxy in front of Caddy. Without it,
      # every visit behind a CDN is attributed to the CDN's own address.
      - AEGIS_TRUSTED_PROXIES=${AEGIS_TRUSTED_PROXIES:-}
      - AEGIS_PUBLIC_BASE_URL=${AEGIS_PUBLIC_BASE_URL:-}
      - AEGIS_SUPABASE_PUBLIC_HOST=${AEGIS_SUPABASE_PUBLIC_HOST:-}
      - DOCKER_SOCKET=/var/run/docker.sock
      - TZ=${TZ:-America/Sao_Paulo}
      # Required. The container refuses to start if these are unset; generate
      # them with: openssl rand -hex 32
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no arquivo .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?defina ENCRYPTION_KEY no arquivo .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      - ./caddy:/app/caddy
      # Read-only: the backend consumes Caddy's access log and must never be
      # able to alter or truncate it.
      - caddy_logs:/var/log/caddy:ro
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Frontend Web Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegis-frontend
    restart: unless-stopped
    ports:
      # Loopback by default: credentials and JWTs must not travel over plain
      # HTTP on the public interface. Publish through Caddy/HTTPS or use SSH
      # port forwarding during bootstrap.
      - "${PANEL_BIND:-127.0.0.1}:3000:80"
    environment:
      - TZ=${TZ:-America/Sao_Paulo}
    depends_on:
      - backend
    networks:
      - aegis-net

networks:
  # Name is left to Compose (aegispanel_aegis-net). Pinning it to "aegis-net"
  # orphans every application container already attached to the generated name:
  # Compose then tries to remove the old network, fails because those containers
  # still hold endpoints on it, and Caddy ends up on a different network from
  # the apps it proxies.
  aegis-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
